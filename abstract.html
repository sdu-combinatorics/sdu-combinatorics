<script>
    (async function () {
        function escapeHtml(unsafe) {
            if (unsafe === null || unsafe === undefined) return '';
            return String(unsafe)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function rawHtml(value, fallback = '') {
            return value === null || value === undefined || value === '' ? fallback : value;
        }

        async function waitForImages(root) {
            const images = Array.from(root.querySelectorAll('img'));
            await Promise.all(images.map(img => {
                if (img.complete && img.naturalWidth > 0) return Promise.resolve();
                return new Promise(resolve => {
                    img.addEventListener('load', resolve, { once: true });
                    img.addEventListener('error', resolve, { once: true });
                });
            }));
        }

        async function waitForMathReady(node) {
            if (window.MathJax && window.MathJax.startup && window.MathJax.startup.promise) {
                await window.MathJax.startup.promise;
            }

            if (window.MathJax && window.MathJax.typesetPromise) {
                await window.MathJax.typesetPromise([node]);
            }

            if (document.fonts && document.fonts.ready) {
                await document.fonts.ready;
            }

            await waitForImages(node);

            await new Promise(resolve =>
                requestAnimationFrame(() =>
                    requestAnimationFrame(resolve)
                )
            );
        }

        function isWeChatBrowser() {
            return /MicroMessenger/i.test(navigator.userAgent);
        }

        function canWriteImageToClipboard() {
            return !!(
                window.isSecureContext &&
                navigator.clipboard &&
                typeof navigator.clipboard.write === 'function' &&
                window.ClipboardItem
            );
        }

        async function tryWriteBlobToClipboard(blob) {
            await navigator.clipboard.write([
                new ClipboardItem({ [blob.type]: blob })
            ]);
        }

        async function tryNativeShare(blob, fileName = 'abstract.png') {
            if (!navigator.canShare || !navigator.share) return false;

            try {
                const file = new File([blob], fileName, { type: blob.type });
                if (navigator.canShare({ files: [file] })) {
                    await navigator.share({
                        files: [file],
                        title: 'Abstract Screenshot'
                    });
                    return true;
                }
            } catch (err) {
                console.warn('Native share failed:', err);
            }

            return false;
        }

        function showImagePreviewOverlay(blob, tipText = 'Press and hold the image to save or share.') {
            const url = URL.createObjectURL(blob);

            const overlay = document.createElement('div');
            overlay.style.position = 'fixed';
            overlay.style.inset = '0';
            overlay.style.background = 'rgba(0,0,0,0.75)';
            overlay.style.zIndex = '99999';
            overlay.style.display = 'flex';
            overlay.style.flexDirection = 'column';
            overlay.style.alignItems = 'center';
            overlay.style.justifyContent = 'center';
            overlay.style.padding = '1rem';

            const tip = document.createElement('div');
            tip.textContent = tipText;
            tip.style.color = '#fff';
            tip.style.fontSize = '1rem';
            tip.style.marginBottom = '1rem';
            tip.style.textAlign = 'center';
            tip.style.maxWidth = '90%';

            const img = document.createElement('img');
            img.src = url;
            img.alt = 'Abstract Screenshot Preview';
            img.style.maxWidth = '95%';
            img.style.maxHeight = '75vh';
            img.style.borderRadius = '12px';
            img.style.boxShadow = '0 0.5rem 1rem rgba(0,0,0,0.25)';
            img.style.background = '#fff';

            const closeBtn = document.createElement('button');
            closeBtn.textContent = 'Close';
            closeBtn.style.marginTop = '1rem';
            closeBtn.style.padding = '0.5rem 1rem';
            closeBtn.style.border = 'none';
            closeBtn.style.borderRadius = '8px';
            closeBtn.style.cursor = 'pointer';

            function cleanup() {
                URL.revokeObjectURL(url);
                overlay.remove();
            }

            closeBtn.addEventListener('click', cleanup);
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) cleanup();
            });

            overlay.appendChild(tip);
            overlay.appendChild(img);
            overlay.appendChild(closeBtn);
            document.body.appendChild(overlay);
        }

        async function shareImageBlob(blob, options = {}) {
            const {
                fileName = 'abstract.png',
                successMessage = '✅ Screenshot copied to clipboard.'
            } = options;

            if (!isWeChatBrowser() && canWriteImageToClipboard()) {
                try {
                    await tryWriteBlobToClipboard(blob);
                    alert(successMessage);
                    return;
                } catch (err) {
                    console.warn('Clipboard image write failed:', err);
                }
            }

            const shared = await tryNativeShare(blob, fileName);
            if (shared) return;

            showImagePreviewOverlay(
                blob,
                isWeChatBrowser()
                    ? 'In WeChat, please long-press the image to save or share.'
                    : 'Press and hold the image to save or share.'
            );
        }

        async function captureAbstractAndShare(node, button) {
            if (!node) return;

            const originalText = button ? button.innerHTML : '';

            try {
                if (button) {
                    button.disabled = true;
                    button.innerHTML = '<i class="bi bi-hourglass-split"></i> Generating...';
                }

                if (document.fonts && document.fonts.ready) {
                    await document.fonts.ready;
                }

                await waitForImages(node);
                await new Promise(resolve => requestAnimationFrame(resolve));

                const blob = await domtoimage.toBlob(node, {
                    bgcolor: '#ffffff',
                    style: {
                        transform: 'none'
                    }
                });

                await shareImageBlob(blob, {
                    fileName: 'abstract.png',
                    successMessage: '✅ Screenshot copied to clipboard.'
                });
            } catch (error) {
                console.error('Failed to generate screenshot:', error);
                alert('Failed to generate screenshot. Please check the console for details.');
            } finally {
                if (button) {
                    button.disabled = false;
                    button.innerHTML = originalText;
                }
            }
        }

        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');

        const container = document.getElementById('abstract-container');
        const loadingSpinner = document.getElementById('loading-spinner');
        const actionButtonsDiv = document.getElementById('action-buttons');
        const copyScreenshotBtn = document.getElementById('copy-screenshot-btn');

        if (!id) {
            if (loadingSpinner) loadingSpinner.style.display = 'none';
            container.innerHTML = `
                <div class="alert alert-warning text-center py-5" role="alert">
                    <i class="bi bi-exclamation-triangle" style="font-size: 3rem;"></i>
                    <h3 class="mt-3">Missing ID Parameter</h3>
                    <p>Please specify ?id=xxx in the URL.</p>
                    <a href="${id && id.startsWith('ai-') ? 'aitalks.html' : 'seminars.html'}" class="btn btn-primary mt-3">${id && id.startsWith('ai-') ? 'Back to AI Talks' : 'Back to Seminar List'}</a>
                </div>
            `;
            return;
        }

        try {
            const response = await fetch('static/data/abstracts.json', { cache: 'no-store' });
            if (!response.ok) {
                throw new Error(`HTTP ${response.status} - Failed to load data file`);
            }

            const abstractsData = await response.json();
            const data = abstractsData[id];

            if (!data) {
                throw new Error(`ID "${id}" does not exist`);
            }

            const isPaper = data.type === 'paper';
            document.title = `${data.title || 'Abstract'} | SDU Combinatorics Group`;

            const backLink = document.getElementById('abstract-back-link');
            if (backLink) {
                backLink.href = isPaper ? 'aitalks.html' : 'seminars.html';
                backLink.textContent = isPaper ? 'All AI Talks' : 'All seminars';
            }

            const zoomMeetingId = "632 7868 8120";
            const zoomPasscode = "SDUCOMB";
            const zoomUrl = "https://syddanskuni.zoom.us/j/63278688120?pwd=yMJb3DVFAt3oT5zHuQfw8Uau0CZPrb.1";

            const paperAuthorsHtml = Array.isArray(data.authors) && data.authors.length
                ? data.authors.map(author => {
                    const authorName = escapeHtml(author.name || 'Unknown');
                    const authorLink = author.url
                        ? `<a href="${escapeHtml(author.url)}" target="_blank" rel="noopener">${authorName}</a>`
                        : authorName;
                    const affiliation = author.affiliation
                        ? `<div class="author-affiliation">${escapeHtml(author.affiliation)}</div>`
                        : '';
                    const email = author.email
                        ? `<div class="author-email"><a href="mailto:${escapeHtml(author.email)}">${escapeHtml(author.email)}</a></div>`
                        : '';

                    return `
                        <div class="author-item">
                            <strong>${authorLink}</strong>
                            ${affiliation}
                            ${email}
                        </div>
                    `;
                }).join('')
                : '<p>Author information is not available.</p>';

            const cardHtml = isPaper ? `
                <div id="abstract-card" class="abstract-card paper-card">
                    <img src="static/assets/img/SDU-logo.png"
                         alt="Shandong University"
                         class="card-logo">

                    <div class="name">${escapeHtml(data.title || 'Untitled')}</div>

                    <div class="abstract-label">Abstract</div>
                    <div class="abstract-content fs-5 mb-4">
                        ${rawHtml(data.abstract, '')}
                    </div>

                    <div class="abstract-label">Author Information</div>
                    <div class="bio-content">
                        ${paperAuthorsHtml}
                    </div>
                </div>
            ` : `
                <div id="abstract-card" class="abstract-card">
                    <img src="static/assets/img/SDU-logo.png" alt="Logo" class="card-logo">

                    <div class="name">${escapeHtml(data.name || 'Unknown')}</div>
                    <div class="title">${escapeHtml(data.title || 'Untitled')}</div>

                    <div class="meta-row">
                        <span class="meta-item">
                            <strong>Time:</strong> ${escapeHtml(data.date || '')}
                        </span>
                        <span class="meta-item">
                            <strong>Zoom ID:</strong>
                            <a href="${zoomUrl}" target="_blank" rel="noopener">${zoomMeetingId}</a>
                        </span>
                        <span class="meta-item">
                            <strong>Password:</strong> ${zoomPasscode}
                        </span>
                        <span class="meta-item">
                            <strong>Website:</strong>
                            <a href="https://www.wgh-comb.net" target="_blank" rel="noopener">wgh-comb.net</a>
                        </span>
                    </div>

                    <div class="abstract-label">Abstract</div>
                    <div class="abstract-content fs-5 mb-4">${rawHtml(data.abstract, '')}</div>

                    ${data.bio ? `<div class="abstract-label">Introduction</div><div class="bio-content">${rawHtml(data.bio, '')}</div>` : ''}
                </div>
            `;

            if (loadingSpinner) loadingSpinner.style.display = 'none';
            container.innerHTML = cardHtml;
            actionButtonsDiv.style.setProperty('display', 'flex');

            const cardElement = document.getElementById('abstract-card');
            await waitForMathReady(cardElement);

            copyScreenshotBtn.addEventListener('click', async function () {
                const card = document.getElementById('abstract-card');
                await captureAbstractAndShare(card, this);
            });
        } catch (error) {
            if (loadingSpinner) loadingSpinner.style.display = 'none';
            container.innerHTML = `
                <div class="alert alert-danger text-center py-5" role="alert">
                    <i class="bi bi-exclamation-triangle" style="font-size: 3rem;"></i>
                    <h3 class="mt-3">Failed to Load</h3>
                    <p>${escapeHtml(error.message)}</p>
                    <a href="${id && id.startsWith('ai-') ? 'aitalks.html' : 'seminars.html'}" class="btn btn-primary mt-3">${id && id.startsWith('ai-') ? 'Back to AI Talks' : 'Back to Seminar List'}</a>
                </div>
            `;
        }

        const copyrightEl = document.getElementById('copyright-text');
        if (copyrightEl) {
            const year = new Date().getFullYear();
            copyrightEl.innerHTML = `© ${year} SDU Combinatorics Group. All rights reserved.`;
        }
    })();
</script>
